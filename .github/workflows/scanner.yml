name: HardGamers Deals Scanner

on:
  schedule:
    # Prueba temporal: se ejecutará a las 07:50 UTC
    - cron: '50 8 * * *'
  workflow_dispatch:
    inputs:
      min_discount:
        description: 'Porcentaje mínimo de descuento (%)'
        required: false
        default: '25'
      max_deals:
        description: 'Máximo de ofertas principales a validar'
        required: false
        default: '250'
      delay:
        description: 'Delay en segundos entre peticiones'
        required: false
        default: '1.0'
      send_email:
        description: 'Enviar reporte por email'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  scrape-and-analyze:
    name: Scrape & Analyze Deals
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Deals Scanner & Notifier
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          REQUEST_DELAY_SECONDS: "1.5"
          MIN_COMPETITOR_DISCOUNT_PERCENT: "10.0"
        run: |
          ARGS="--output-file today_deals.txt"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.send_email }}" = "false" ]; then
              ARGS="$ARGS --no-email"
            fi
            if [ -n "${{ inputs.min_discount }}" ]; then
              ARGS="$ARGS --min-discount ${{ inputs.min_discount }}"
            fi
            if [ -n "${{ inputs.max_deals }}" ]; then
              ARGS="$ARGS --max-deals-to-validate ${{ inputs.max_deals }}"
            fi
            if [ -n "${{ inputs.delay }}" ]; then
              ARGS="$ARGS --delay ${{ inputs.delay }}"
            fi
          fi

          echo "Ejecutando: uv run python main.py $ARGS"
          uv run python main.py $ARGS

      - name: Subir el archivo de deals actuales
        uses: actions/upload-artifact@v7
        with:
          name: today_deals.txt     # Nombre que tendrá el artefacto en GitHub
          path: today_deals.txt

      - name: Preparar archivo HTML desde Markdown
        run: |
          mkdir public
          
          # Si tu script genera un index.md o ofertas.txt
          CONTENT=""
          if [ -f index.md ]; then
            CONTENT=$(cat index.md)
          elif [ -f today_deals.txt ]; then
            CONTENT=$(cat today_deals.txt)
          fi

          # Generamos un index.html con un estilo limpio de Markdown
          cat << 'EOF' > public/index.html
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Ofertas Hardgamers</title>
            <!-- Cargamos estilos tipo GitHub para que el Markdown se vea bien -->
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.0/github-markdown.min.css">
            <style>
              body {
                box-sizing: border-box;
                min-width: 200px;
                max-width: 980px;
                margin: 0 auto;
                padding: 45px;
                background-color: #0d1117;
              }
              @media (max-width: 767px) {
                body { padding: 15px; }
              }
            </style>
          </head>
          <body class="markdown-body" data-color-mode="dark" data-dark-theme="dark">
            <div id="content"></div>
            <!-- Script liviano para renderizar el Markdown automáticamente -->
            <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
            <script>
              const markdownText = `CONTENT_PLACEHOLDER`;
              document.getElementById('content').innerHTML = marked.parse(markdownText);
            </script>
          </body>
          </html>
          EOF

          # Reemplazamos el placeholder por el contenido real
          python3 -c "
          import sys
          with open('public/index.html', 'r') as f:
              html = f.read()
          with open('index.md' if os.path.exists('index.md') else 'today_deals.txt', 'r') as f:
              md = f.read()
          html = html.replace('CONTENT_PLACEHOLDER', md.replace('`', '\\`'))
          with open('public/index.html', 'w') as f:
              f.write(html)
          "

      - name: Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: './public'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1